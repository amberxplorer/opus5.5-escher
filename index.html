<script id="synth-src" type="text/plain">
/* ─────────────────────────────────────────────────────────────────────────
   synth.js — the soundtrack, composed and synthesized sample by sample.

   6/8 · a dotted quarter = 64 · 48 bars · 90 seconds, plus a ringing tail.

   The form is a passacaglia "per tonos": one eight-bar ground whose bass
   walks down the scale, bar by bar, until it lands a whole tone *above*
   where it started. Six sections, six keys (D E F♯ G♯ A♯ C), and the
   seventh is D again. The organ, the bass and the harpsichord are voiced
   as octave stacks under a fixed spectral window (Shepard tones), so the
   music keeps descending in its bass and ascending in its keys and still
   arrives, after ninety seconds, exactly where it began.

   Runs inside a Web Worker (or on the main thread / in Node for testing).
   Exposes SYNTH.renderGen(opts): yields progress (0‥1), returns the stereo
   mix, per-stem envelopes for the visuals, and the score itself.
   ───────────────────────────────────────────────────────────────────────── */
var SYNTH = (function () {
'use strict';

const EIGHTH = 0.3125;
const STEP = EIGHTH / 2;        // a sixteenth, 0.15625 s
const BEAT = EIGHTH * 3;        // dotted quarter, 0.9375 s
const BAR = EIGHTH * 6;         // 1.875 s
const BARS = 48;
const PIECE = BARS * BAR;       // 90 s
const TAIL = 3;                 // the first chord again, ringing out
const DURATION = PIECE + TAIL;
const T = (bar, step) => (bar * 12 + (step || 0)) * STEP;
const TAU = Math.PI * 2;
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

const STEMS = ['kick', 'snare', 'hat', 'tick', 'bass', 'organ', 'lead', 'harp', 'bell', 'strings', 'fx', 'timp'];
const ST = {}; STEMS.forEach((s, i) => (ST[s] = i));

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ═════════════════════════════ HARMONY ═════════════════════════════ */

// The ground, relative to the section's tonic. `bass` walks down; `sc` is the
// scale heard over that bar, indexed by degree from the tonic.
const MINOR = [0, 2, 3, 5, 7, 8, 10], HARM = [0, 2, 3, 5, 7, 8, 11], MAJOR = [0, 2, 4, 5, 7, 9, 11];
const PIVOT = [0, 2, 4, 5, 7, 9, 10];                    // the next key, heard from here
const PROG = {
  m: [
    { bass: 0, root: 0, deg: 0, tones: [0, 3, 7], sc: MINOR },          // i
    { bass: -2, root: 7, deg: 4, tones: [7, 10, 2], sc: MINOR },        // v6
    { bass: -4, root: 5, deg: 3, tones: [5, 8, 0], sc: MINOR },         // iv6
    { bass: -5, root: 7, deg: 4, tones: [7, 11, 2], sc: HARM },         // V
    { bass: -7, root: 5, deg: 3, tones: [5, 8, 0, 3], sc: MINOR },      // iv7
    { bass: -9, root: 3, deg: 2, tones: [3, 7, 10], sc: MINOR },        // III
    { bass: -10, root: 10, deg: 6, tones: [10, 2, 5], sc: PIVOT },      // VII6 = VI of the next key
    { bass: -15, root: 9, deg: 5, tones: [9, 1, 4, 7], sc: null },      // V7 of the next key
  ],
  M: [
    { bass: 0, root: 0, deg: 0, tones: [0, 4, 7], sc: MAJOR },          // I
    { bass: -1, root: 7, deg: 4, tones: [7, 11, 2], sc: MAJOR },        // V6
    { bass: -3, root: 9, deg: 5, tones: [9, 0, 4], sc: MAJOR },         // vi
    { bass: -5, root: 7, deg: 4, tones: [7, 11, 2], sc: MAJOR },        // V
    { bass: -7, root: 5, deg: 3, tones: [5, 9, 0, 4], sc: MAJOR },      // IVmaj7
    { bass: -8, root: 0, deg: 0, tones: [0, 4, 7], sc: MAJOR },         // I6
    { bass: -10, root: 10, deg: 6, tones: [10, 2, 5], sc: PIVOT },      // ♭VII6
    { bass: -15, root: 9, deg: 5, tones: [9, 1, 4, 7], sc: null },      // V7 of the next key
  ],
};
const SEC_MODE = ['m', 'M', 'm', 'M', 'm', 'm'];
// section 2 is Day and Night: major until the picture inverts at bar 12
const modeAt = (bar) => { const s = Math.floor(bar / 8) % 6; return s === 1 && bar % 8 >= 4 ? 'm' : SEC_MODE[s]; };

function chordAt(bar) {
  const s = Math.floor(bar / 8), i = bar % 8;
  const mode = bar >= BARS ? 'm' : modeAt(bar);
  const P = PROG[mode][bar >= BARS ? 0 : i];
  let sc = P.sc;
  if (!sc) sc = SEC_MODE[(s + 1) % 6] === 'm' ? [1, 2, 4, 5, 7, 9, 10] : [1, 2, 4, 6, 7, 9, 11];
  const tonic = 62 + 2 * s;
  return { bar, s, i, mode, tonic, sc, deg: P.deg, root: tonic + P.root, bass: tonic + P.bass, tones: P.tones.map((x) => tonic + x) };
}
const pc = (m) => ((m % 12) + 12) % 12;

// key-degree index of a pitch in a chord's scale (+7 per octave)
function degreeOf(ch, midi) {
  const rel = midi - ch.tonic;
  const oct = Math.floor(rel / 12), r = rel - oct * 12;
  let best = 0, bd = 99;
  for (let i = 0; i < 7; i++) { const d = Math.abs(ch.sc[i] - r); if (d < bd) { bd = d; best = i; } }
  return best + 7 * oct;
}
// realize a chord-relative degree over a chord
function realize(ch, d) {
  const k = ch.deg + d, oct = Math.floor(k / 7), i = k - oct * 7;
  return ch.tonic + ch.sc[i] + 12 * oct;
}

/* ═════════════════════════════ THE SUBJECT ═════════════════════════════ */

// written in D minor over section 1: [bar, sixteenth, length, midi]
const SUBJECT = [
  [0, 0, 4, 69], [0, 4, 2, 74], [0, 6, 4, 77], [0, 10, 2, 76],
  [1, 0, 4, 76], [1, 4, 2, 72], [1, 6, 6, 69],
  [2, 0, 4, 70], [2, 4, 2, 74], [2, 6, 4, 79], [2, 10, 2, 77],
  [3, 0, 6, 76], [3, 6, 2, 73], [3, 8, 2, 74], [3, 10, 2, 76],
  [4, 0, 4, 77], [4, 4, 2, 74], [4, 6, 4, 82], [4, 10, 2, 81],
  [5, 0, 4, 81], [5, 4, 2, 77], [5, 6, 4, 84], [5, 10, 2, 82],
  [6, 0, 4, 81], [6, 4, 2, 79], [6, 6, 2, 76], [6, 8, 2, 78], [6, 10, 2, 79],
  [7, 0, 6, 81], [7, 6, 2, 78], [7, 8, 2, 75], [7, 10, 2, 78],
];
// as chord-relative degrees, so it can be heard over any bar of any key
const SUBJ = SUBJECT.map(([b, s, l, m]) => { const ch = chordAt(b); return { b, s, l, d: degreeOf(ch, m) - ch.deg }; });

/* ═════════════════════════════ THE SCORE ═════════════════════════════ */

function buildScore() {
  const R = rng(1898);
  const S = {
    kick: [], kickM: [], clap: [], snare: [], hatC: [], hatO: [], tick: [], ant: [], step: [], tom: [], timp: [],
    crash: [], impact: [], revCym: [], whoosh: [], down: [], gliss: [], organ: [], bass: [], lead: [], canon: [],
    harp: [], bell: [], strings: [], chords: [], shep: [], risset: [], marks: [],
  };
  const hum = (a) => (R() - 0.5) * a;
  for (let b = 0; b <= BARS; b++) {
    const c = chordAt(b);
    S.chords.push({ t: T(b), dur: BAR, bar: b, tones: c.tones, bass: c.bass, root: c.root, s: c.s, mode: c.mode });
  }
  const CH = (b) => chordAt(Math.min(b, BARS));

  /* ── organ: the ground as Shepard chords ── */
  const organ = (b, o) => {
    const c = CH(b);
    const notes = c.tones.slice();
    if (!notes.some((n) => pc(n) === pc(c.bass))) notes.push(c.bass);
    S.organ.push({ t: T(b), dur: o.dur || BAR, notes, att: o.att || 0.09, rel: o.rel || 0.45, vel: o.vel, center: o.center || 300, sigma: o.sigma || 0.95, bar: b });
  };
  organ(0, { vel: 0.8, att: 2.6, center: 240, dur: BAR });
  for (let b = 1; b < 8; b++) organ(b, { vel: 0.8 + b * 0.02, center: 250 + b * 8 });
  for (let b = 8; b < 16; b++) organ(b, { vel: b < 12 ? 0.62 : 0.7, center: b < 12 ? 380 : 300 });
  for (let b = 16; b < 24; b++) organ(b, { vel: b === 18 || b === 19 ? 0.85 : 0.5, center: 360 });
  for (let b = 24; b < 32; b++) organ(b, { vel: 0.9, att: 0.35, rel: 0.7, center: 320 });
  for (let b = 32; b < 40; b++) organ(b, { vel: 0.55, center: 420 });
  for (let b = 40; b < 44; b++) organ(b, { vel: 0.85, att: 0.25, rel: 0.6, center: 360 });
  for (let b = 44; b < 48; b++) organ(b, { vel: 0.8 - (b - 44) * 0.03, center: 300 - (b - 44) * 10 });
  organ(48, { vel: 0.75, att: 0.06, dur: TAIL - 0.4, rel: 1.6, center: 240 });

  /* ── bass: the descending ground, Shepard-stacked ── */
  const bassNote = (b, s, len, vel, pl) => S.bass.push({ t: T(b, s), dur: len * STEP, note: CH(b).bass, vel, pluck: pl || 0, bar: b });
  for (let b = 4; b < 8; b++) bassNote(b, 0, 11.6, 0.55 + (b - 4) * 0.08, 0);
  for (let b = 8; b < 16; b++) {
    if (b === 15) { for (const s of [0, 3, 6, 8, 10]) bassNote(b, s, 1.7, 0.85, 0.6); continue; }
    bassNote(b, 0, 5.6, 0.95, 0.35); bassNote(b, 6, 5.6, 0.75, 0.35);
  }
  const drive = (b0, b1, skip) => {
    for (let b = b0; b < b1; b++) {
      if (skip && skip(b)) continue;
      for (const s of [0, 2, 4, 6, 8, 10]) bassNote(b, s, 1.6, s === 0 ? 1 : s === 6 ? 0.9 : 0.72, 0.8);
    }
  };
  drive(16, 24, (b) => b === 18 || b === 19);
  bassNote(18, 0, 11.7, 0.8, 0); bassNote(19, 0, 11.7, 0.8, 0); // the reveal: held notes
  for (let b = 24; b < 28; b++) bassNote(b, 0, 11.6, 0.6, 0);
  for (let b = 28; b < 32; b++) { bassNote(b, 0, 5.6, 0.75, 0.3); bassNote(b, 6, 5.6, 0.62, 0.3); }
  drive(32, 40);
  for (let b = 40; b < 44; b++) bassNote(b, 0, 11.7, 0.75, 0);
  for (let b = 44; b < 48; b++) bassNote(b, 0, 11.6, 0.55 - (b - 44) * 0.05, 0);
  S.bass.push({ t: T(48), dur: TAIL - 0.6, note: CH(48).bass, vel: 0.42, pluck: 0, bar: 48 });

  /* ── the subject and its transformations ── */
  // Realize template bars [from,to) starting at bar `at`, optionally inverted,
  // reversed or re-timed. Pitch classes come from the chord-relative degree over
  // whatever chord is sounding; octaves follow the template's own intervals so
  // the contour survives; transformed voices snap strong beats to chord tones.
  const phrase = (arr, at, from, to, o) => {
    o = o || {};
    const sp = o.speed || 1;
    const src = SUBJ.map((n, i) => ({ ...n, m: SUBJECT[i][3] })).filter((n) => n.b >= from && n.b < to);
    const evs = src.map((n) => {
      let pos = ((n.b - from) * 12 + n.s) / sp, len = n.l / sp;
      if (o.retro) pos = (to - from) * 12 / sp - pos - len;
      return { n, pos, len };
    }).sort((a, b) => a.pos - b.pos);
    let prevT = null, prevOut = null;
    for (const { n, pos, len } of evs) {
      const tb = at + Math.floor(pos / 12 + 1e-9), ts = pos - (tb - at) * 12;
      if (o.until !== undefined && tb >= o.until) continue;
      const ch = CH(tb);
      const d = o.invert ? 4 - n.d : n.d;
      let note = realize(ch, d);
      const strong = Math.abs(ts) < 1e-6 || Math.abs(ts - 6) < 1e-6;
      if ((o.invert || o.retro || sp !== 1 || o.snap) && strong && !ch.tones.some((x) => pc(x) === pc(note))) {
        let best = note, bd = 99;
        for (const x of ch.tones) for (let k = -2; k <= 2; k++) { const c = x + 12 * k; const dd = Math.abs(c - note); if (dd < bd && dd > 0) { bd = dd; best = c; } }
        note = best;
      }
      let expect;
      if (prevT === null) expect = o.near !== undefined ? o.near : n.m + 2 * Math.floor(at / 8) + (o.oct || 0) * 12;
      else expect = prevOut + (o.invert ? -1 : 1) * (n.m - prevT);
      while (note - expect > 6) note -= 12;
      while (expect - note > 6) note += 12;
      if (o.near !== undefined) { while (note > o.near + 10) note -= 12; while (note < o.near - 10) note += 12; }
      prevT = n.m; prevOut = note;
      arr.push({ t: T(tb, ts), dur: len * STEP * (o.legato || 0.94), note, vel: o.vel || 1, bar: tb, s: ts, voice: o.voice || 0, pan: o.pan || 0 });
    }
  };
  // lead (organ-flute stack)
  phrase(S.lead, 4, 4, 8, { vel: 0.7 });
  phrase(S.lead, 8, 0, 4, { vel: 0.85 });
  phrase(S.lead, 12, 4, 8, { vel: 0.9, invert: true, near: 78 });
  phrase(S.lead, 16, 0, 8, { vel: 1, voice: 1 });
  phrase(S.lead, 24, 0, 8, { vel: 0.75 });
  phrase(S.lead, 32, 0, 8, { vel: 1, voice: 1 });
  phrase(S.lead, 40, 0, 2, { vel: 0.8, speed: 0.5 });
  phrase(S.lead, 44, 4, 8, { vel: 0.72 });
  // canon voices (celesta), a bar behind, an octave up
  phrase(S.canon, 9, 0, 3, { vel: 0.55, near: 83, pan: 0.35, snap: 1 });
  phrase(S.canon, 13, 4, 7, { vel: 0.6, invert: true, near: 86, pan: 0.35 });
  phrase(S.canon, 17, 0, 7, { vel: 0.6, near: 85, pan: 0.4, snap: 1 });
  // the crab: the subject backwards, against itself
  phrase(S.canon, 24, 0, 8, { vel: 0.72, retro: true, near: 82, pan: -0.3 });
  // augmentation (tenor organ, half speed) and diminution (celesta, double speed)
  phrase(S.canon, 32, 0, 4, { vel: 0.8, speed: 0.5, near: 58, voice: 2, legato: 0.98 });
  phrase(S.canon, 32, 0, 8, { vel: 0.42, speed: 2, near: 84, pan: 0.45 });
  phrase(S.canon, 36, 0, 8, { vel: 0.42, speed: 2, near: 84, pan: -0.45 });

  /* ── harpsichord ── */
  const PAT = {
    A: [0, 1, 2, 1, 2, 3, 2, 3, 4, 3, 4, 5],        // stairs: up two, back one
    B: [0, 2, 4, 1, 3, 5, 2, 4, 6, 3, 5, 7],
    C: [0, -1, 2, -1, 4, -1, 3, -1, 5, -1, 4, -1],   // eighths
    D: [0, 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1],
  };
  const harpBar = (b, pat, vel, o) => {
    o = o || {};
    const c = CH(b);
    const pcs = c.tones.map(pc);
    let lo = 50 + pc(c.bass - 50);
    const tones = [];
    for (let m = lo; tones.length < 10; m++) if (pcs.includes(pc(m))) tones.push(m);
    PAT[pat].forEach((ix, s) => {
      if (ix < 0) return;
      if (o.from !== undefined && s < o.from) return;
      if (o.to !== undefined && s >= o.to) return;
      const acc = s === 0 ? 1 : s === 6 ? 0.85 : s % 2 === 0 ? 0.7 : 0.55;
      const len = pat === 'C' ? 2 : 1;
      S.harp.push({ t: T(b, s) + hum(0.003), dur: len * STEP * 0.92, note: tones[ix] + (o.oct || 0) * 12, vel: vel * acc, bar: b, s, pan: (ix - 3) * 0.12 });
    });
  };
  for (let b = 2; b < 4; b++) harpBar(b, 'A', 0.5 + (b - 2) * 0.15);
  for (let b = 4; b < 8; b++) harpBar(b, 'A', 0.72);
  for (let b = 8; b < 16; b++) harpBar(b, 'A', b >= 14 ? 0.82 : 0.75);
  for (let b = 16; b < 24; b++) { if (b === 18 || b === 19) harpBar(b, 'C', 0.55); else harpBar(b, 'B', 0.8); }
  for (let b = 24; b < 28; b++) harpBar(b, 'C', 0.5);
  for (let b = 28; b < 32; b++) harpBar(b, 'A', 0.55 + (b - 28) * 0.07);
  for (let b = 32; b < 40; b++) harpBar(b, 'D', 0.82);
  for (let b = 44; b < 48; b++) harpBar(b, 'A', 0.62 - (b - 44) * 0.06);

  /* ── strings (a real, voice-led section) ── */
  let prev = [57, 62, 65, 69];
  const strings = (b, vel, o) => {
    o = o || {};
    const c = CH(b);
    const pcs = c.tones.map(pc);
    const cand = []; for (let m = 52; m <= 81; m++) if (pcs.includes(pc(m))) cand.push(m);
    const next = prev.map((p) => cand.reduce((a, x) => (Math.abs(x - p) < Math.abs(a - p) ? x : a), cand[0]));
    // make sure every chord tone is present at least once
    for (const q of pcs) if (!next.some((n) => pc(n) === q)) {
      let bi = 0, bd = 99; next.forEach((n, i) => { const cands = cand.filter((x) => pc(x) === q); const x = cands.reduce((a, y) => (Math.abs(y - n) < Math.abs(a - n) ? y : a), cands[0]); if (Math.abs(x - n) < bd && next.filter((m) => pc(m) === pc(n)).length > 1) { bd = Math.abs(x - n); bi = i; } });
      const cands = cand.filter((x) => pc(x) === q); next[bi] = cands.reduce((a, y) => (Math.abs(y - next[bi]) < Math.abs(a - next[bi]) ? y : a), cands[0]);
    }
    next.sort((a, b2) => a - b2);
    prev = next;
    S.strings.push({ t: T(b), dur: o.dur || BAR, notes: next.slice(), vel, att: o.att || 0.25, rel: o.rel || 0.5, bright: o.bright || 1, bar: b });
  };
  for (let b = 8; b < 16; b++) strings(b, b < 12 ? 0.55 : 0.62, { att: 0.4, bright: b < 12 ? 1 : 0.7 });
  for (let b = 16; b < 24; b++) strings(b, b === 18 || b === 19 ? 0.7 : 0.85, { att: b === 16 || b === 20 ? 0.02 : 0.2, bright: 1.1 });
  for (let b = 32; b < 40; b++) strings(b, 0.95, { att: b === 32 ? 0.02 : 0.15, bright: 1.25 });
  for (let b = 40; b < 44; b++) strings(b, 0.6, { att: 0.6, rel: 0.8, bright: 0.85 });

  /* ── drums & clockwork ── */
  const HATV = [1, 0.38, 0.62, 0.38, 0.62, 0.38, 0.9, 0.38, 0.62, 0.38, 0.62, 0.45];
  const ticks = (b0, b1, vel) => { for (let b = b0; b < b1; b++) for (let s = 0; s < 12; s += 2) S.tick.push({ t: T(b, s) + hum(0.002), vel: vel * (s === 0 ? 1 : 0.8), tock: (s / 2) & 1 }); };
  ticks(2, 4, 0.35); ticks(4, 8, 0.5); ticks(8, 16, 0.55); ticks(16, 18, 0.5); ticks(20, 24, 0.5); ticks(32, 40, 0.45); ticks(44, 47, 0.4);
  // §1: a soft pulse under the metamorphosis
  for (let b = 4; b < 8; b++) S.kickM.push({ t: T(b), vel: 0.45 + (b - 4) * 0.1 });
  // §2: the sway
  for (let b = 8; b < 16; b++) {
    if (b === 15) break;
    S.kick.push({ t: T(b), vel: 0.9 });
    if (b % 2 === 1) S.kick.push({ t: T(b, 10), vel: 0.45 });
    S.clap.push({ t: T(b, 6), vel: 0.75 });
    for (let s = 0; s < 12; s++) S.hatC.push({ t: T(b, s) + hum(0.004), vel: HATV[s] * 0.55 });
  }
  S.kick.push({ t: T(15), vel: 0.9 });
  // bar 15: roll in sixteenths then 32nds
  for (let s = 0; s < 12; s++) S.snare.push({ t: T(15, s), vel: 0.3 + s * 0.035, rate: 1 + s * 0.006 });
  for (let i = 0; i < 12; i++) S.snare.push({ t: T(15, 6) + i * STEP * 0.5, vel: 0.55 + i * 0.03, rate: 1.08 + i * 0.012 });
  // §3: the drive
  const driveDrums = (b0, b1, skip, big) => {
    for (let b = b0; b < b1; b++) {
      if (skip && skip(b)) continue;
      S.kick.push({ t: T(b), vel: 1 }, { t: T(b, 6), vel: 0.95 });
      if (b % 2 === 1) S.kick.push({ t: T(b, 10), vel: 0.6 });

  [0, 0, 4, 69], [0, 4, 2, 74], [0, 6, 4, 77], [0, 10, 2, 76],
  [1, 0, 4, 76], [1, 4, 2, 72], [1, 6, 6, 69],
  [2, 0, 4, 70], [2, 4, 2, 74], [2, 6, 4, 79], [2, 10, 2, 77],
  [3, 0, 6, 76], [3, 6, 2, 73], [3, 8, 2, 74], [3, 10, 2, 76],
  [4, 0, 4, 77], [4, 4, 2, 74], [4, 6, 4, 82], [4, 10, 2, 81],
  [5, 0, 4, 81], [5, 4, 2, 77], [5, 6, 4, 84], [5, 10, 2, 82],
  [6, 0, 4, 81], [6, 4, 2, 79], [6, 6, 2, 76], [6, 8, 2, 78], [6, 10, 2, 79],
  [7, 0, 6, 81], [7, 6, 2, 78], [7, 8, 2, 75], [7, 10, 2, 78],
];
// as chord-relative degrees, so it can be heard over any bar of any key
const SUBJ = SUBJECT.map(([b, s, l, m]) => { const ch = chordAt(b); return { b, s, l, d: degreeOf(ch, m) - ch.deg }; });

/* ═════════════════════════════ THE SCORE ═════════════════════════════ */

function buildScore() {
  const R = rng(1898);
  const S = {
    kick: [], kickM: [], clap: [], snare: [], hatC: [], hatO: [], tick: [], ant: [], step: [], tom: [], timp: [],
    crash: [], impact: [], revCym: [], whoosh: [], down: [], gliss: [], organ: [], bass: [], lead: [], canon: [],
    harp: [], bell: [], strings: [], chords: [], shep: [], risset: [], marks: [],
  };
  const hum = (a) => (R() - 0.5) * a;
  for (let b = 0; b <= BARS; b++) {
    const c = chordAt(b);
    S.chords.push({ t: T(b), dur: BAR, bar: b, tones: c.tones, bass: c.bass, root: c.root, s: c.s, mode: c.mode });
  }
  const CH = (b) => chordAt(Math.min(b, BARS));

  /* ── organ: the ground as Shepard chords ── */
  const organ = (b, o) => {
    const c = CH(b);
    const notes = c.tones.slice();
    if (!notes.some((n) => pc(n) === pc(c.bass))) notes.push(c.bass);
    S.organ.push({ t: T(b), dur: o.dur || BAR, notes, att: o.att || 0.09, rel: o.rel || 0.45, vel: o.vel, center: o.center || 300, sigma: o.sigma || 0.95, bar: b });
  };
  organ(0, { vel: 0.8, att: 2.6, center: 240, dur: BAR });
  for (let b = 1; b < 8; b++) organ(b, { vel: 0.8 + b * 0.02, center: 250 + b * 8 });
  for (let b = 8; b < 16; b++) organ(b, { vel: b < 12 ? 0.62 : 0.7, center: b < 12 ? 380 : 300 });
  for (let b = 16; b < 24; b++) organ(b, { vel: b === 18 || b === 19 ? 0.85 : 0.5, center: 360 });
  for (let b = 24; b < 32; b++) organ(b, { vel: 0.9, att: 0.35, rel: 0.7, center: 320 });
  for (let b = 32; b < 40; b++) organ(b, { vel: 0.55, center: 420 });
  for (let b = 40; b < 44; b++) organ(b, { vel: 0.85, att: 0.25, rel: 0.6, center: 360 });
  for (let b = 44; b < 48; b++) organ(b, { vel: 0.8 - (b - 44) * 0.03, center: 300 - (b - 44) * 10 });
  organ(48, { vel: 0.75, att: 0.06, dur: TAIL - 0.4, rel: 1.6, center: 240 });

  /* ── bass: the descending ground, Shepard-stacked ── */
  const bassNote = (b, s, len, vel, pl) => S.bass.push({ t: T(b, s), dur: len * STEP, note: CH(b).bass, vel, pluck: pl || 0, bar: b });
  for (let b = 4; b < 8; b++) bassNote(b, 0, 11.6, 0.55 + (b - 4) * 0.08, 0);
  for (let b = 8; b < 16; b++) {
    if (b === 15) { for (const s of [0, 3, 6, 8, 10]) bassNote(b, s, 1.7, 0.85, 0.6); continue; }
    bassNote(b, 0, 5.6, 0.95, 0.35); bassNote(b, 6, 5.6, 0.75, 0.35);
  }
  const drive = (b0, b1, skip) => {
    for (let b = b0; b < b1; b++) {
      if (skip && skip(b)) continue;
      for (const s of [0, 2, 4, 6, 8, 10]) bassNote(b, s, 1.6, s === 0 ? 1 : s === 6 ? 0.9 : 0.72, 0.8);
    }
  };
  drive(16, 24, (b) => b === 18 || b === 19);
  bassNote(18, 0, 11.7, 0.8, 0); bassNote(19, 0, 11.7, 0.8, 0); // the reveal: held notes
  for (let b = 24; b < 28; b++) bassNote(b, 0, 11.6, 0.6, 0);
  for (let b = 28; b < 32; b++) { bassNote(b, 0, 5.6, 0.75, 0.3); bassNote(b, 6, 5.6, 0.62, 0.3); }
  drive(32, 40);
  for (let b = 40; b < 44; b++) bassNote(b, 0, 11.7, 0.75, 0);
  for (let b = 44; b < 48; b++) bassNote(b, 0, 11.6, 0.55 - (b - 44) * 0.05, 0);
  S.bass.push({ t: T(48), dur: TAIL - 0.6, note: CH(48).bass, vel: 0.42, pluck: 0, bar: 48 });

  /* ── the subject and its transformations ── */
  // Realize template bars [from,to) starting at bar `at`, optionally inverted,
  // reversed or re-timed. Pitch classes come from the chord-relative degree over
  // whatever chord is sounding; octaves follow the template's own intervals so
  // the contour survives; transformed voices snap strong beats to chord tones.
  const phrase = (arr, at, from, to, o) => {
    o = o || {};
    const sp = o.speed || 1;
    const src = SUBJ.map((n, i) => ({ ...n, m: SUBJECT[i][3] })).filter((n) => n.b >= from && n.b < to);
    const evs = src.map((n) => {
      let pos = ((n.b - from) * 12 + n.s) / sp, len = n.l / sp;
      if (o.retro) pos = (to - from) * 12 / sp - pos - len;
      return { n, pos, len };
    }).sort((a, b) => a.pos - b.pos);
    let prevT = null, prevOut = null;
    for (const { n, pos, len } of evs) {
      const tb = at + Math.floor(pos / 12 + 1e-9), ts = pos - (tb - at) * 12;
      if (o.until !== undefined && tb >= o.until) continue;
      const ch = CH(tb);
      const d = o.invert ? 4 - n.d : n.d;
      let note = realize(ch, d);
      const strong = Math.abs(ts) < 1e-6 || Math.abs(ts - 6) < 1e-6;
      if ((o.invert || o.retro || sp !== 1 || o.snap) && strong && !ch.tones.some((x) => pc(x) === pc(note))) {
        let best = note, bd = 99;
        for (const x of ch.tones) for (let k = -2; k <= 2; k++) { const c = x + 12 * k; const dd = Math.abs(c - note); if (dd < bd && dd > 0) { bd = dd; best = c; } }
        note = best;
      }
      let expect;
      if (prevT === null) expect = o.near !== undefined ? o.near : n.m + 2 * Math.floor(at / 8) + (o.oct || 0) * 12;
      else expect = prevOut + (o.invert ? -1 : 1) * (n.m - prevT);
      while (note - expect > 6) note -= 12;
      while (expect - note > 6) note += 12;
      if (o.near !== undefined) { while (note > o.near + 10) note -= 12; while (note < o.near - 10) note += 12; }
      prevT = n.m; prevOut = note;
      arr.push({ t: T(tb, ts), dur: len * STEP * (o.legato || 0.94), note, vel: o.vel || 1, bar: tb, s: ts, voice: o.voice || 0, pan: o.pan || 0 });
    }
  };
  // lead (organ-flute stack)
  phrase(S.lead, 4, 4, 8, { vel: 0.7 });
  phrase(S.lead, 8, 0, 4, { vel: 0.85 });
  phrase(S.lead, 12, 4, 8, { vel: 0.9, invert: true, near: 78 });
  phrase(S.lead, 16, 0, 8, { vel: 1, voice: 1 });
  phrase(S.lead, 24, 0, 8, { vel: 0.75 });
  phrase(S.lead, 32, 0, 8, { vel: 1, voice: 1 });
  phrase(S.lead, 40, 0, 2, { vel: 0.8, speed: 0.5 });
  phrase(S.lead, 44, 4, 8, { vel: 0.72 });
  // canon voices (celesta), a bar behind, an octave up
  phrase(S.canon, 9, 0, 3, { vel: 0.55, near: 83, pan: 0.35, snap: 1 });
  phrase(S.canon, 13, 4, 7, { vel: 0.6, invert: true, near: 86, pan: 0.35 });
  phrase(S.canon, 17, 0, 7, { vel: 0.6, near: 85, pan: 0.4, snap: 1 });
  // the crab: the subject backwards, against itself
  phrase(S.canon, 24, 0, 8, { vel: 0.72, retro: true, near: 82, pan: -0.3 });
  // augmentation (tenor organ, half speed) and diminution (celesta, double speed)
  phrase(S.canon, 32, 0, 4, { vel: 0.8, speed: 0.5, near: 58, voice: 2, legato: 0.98 });
  phrase(S.canon, 32, 0, 8, { vel: 0.42, speed: 2, near: 84, pan: 0.45 });
  phrase(S.canon, 36, 0, 8, { vel: 0.42, speed: 2, near: 84, pan: -0.45 });

  /* ── harpsichord ── */
  const PAT = {
    A: [0, 1, 2, 1, 2, 3, 2, 3, 4, 3, 4, 5],        // stairs: up two, back one
    B: [0, 2, 4, 1, 3, 5, 2, 4, 6, 3, 5, 7],
    C: [0, -1, 2, -1, 4, -1, 3, -1, 5, -1, 4, -1],   // eighths
    D: [0, 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1],
  };
  const harpBar = (b, pat, vel, o) => {
    o = o || {};
    const c = CH(b);
    const pcs = c.tones.map(pc);
    let lo = 50 + pc(c.bass - 50);
    const tones = [];
    for (let m = lo; tones.length < 10; m++) if (pcs.includes(pc(m))) tones.push(m);
    PAT[pat].forEach((ix, s) => {
      if (ix < 0) return;
      if (o.from !== undefined && s < o.from) return;
      if (o.to !== undefined && s >= o.to) return;
      const acc = s === 0 ? 1 : s === 6 ? 0.85 : s % 2 === 0 ? 0.7 : 0.55;
      const len = pat === 'C' ? 2 : 1;
      S.harp.push({ t: T(b, s) + hum(0.003), dur: len * STEP * 0.92, note: tones[ix] + (o.oct || 0) * 12, vel: vel * acc, bar: b, s, pan: (ix - 3) * 0.12 });
    });
  };
  for (let b = 2; b < 4; b++) harpBar(b, 'A', 0.5 + (b - 2) * 0.15);
  for (let b = 4; b < 8; b++) harpBar(b, 'A', 0.72);
  for (let b = 8; b < 16; b++) harpBar(b, 'A', b >= 14 ? 0.82 : 0.75);
  for (let b = 16; b < 24; b++) { if (b === 18 || b === 19) harpBar(b, 'C', 0.55); else harpBar(b, 'B', 0.8); }
  for (let b = 24; b < 28; b++) harpBar(b, 'C', 0.5);
  for (let b = 28; b < 32; b++) harpBar(b, 'A', 0.55 + (b - 28) * 0.07);
  for (let b = 32; b < 40; b++) harpBar(b, 'D', 0.82);
  for (let b = 44; b < 48; b++) harpBar(b, 'A', 0.62 - (b - 44) * 0.06);

  /* ── strings (a real, voice-led section) ── */
  let prev = [57, 62, 65, 69];
  const strings = (b, vel, o) => {
    o = o || {};
    const c = CH(b);
    const pcs = c.tones.map(pc);
    const cand = []; for (let m = 52; m <= 81; m++) if (pcs.includes(pc(m))) cand.push(m);
    const next = prev.map((p) => cand.reduce((a, x) => (Math.abs(x - p) < Math.abs(a - p) ? x : a), cand[0]));
    // make sure every chord tone is present at least once
    for (const q of pcs) if (!next.some((n) => pc(n) === q)) {
      let bi = 0, bd = 99; next.forEach((n, i) => { const cands = cand.filter((x) => pc(x) === q); const x = cands.reduce((a, y) => (Math.abs(y - n) < Math.abs(a - n) ? y : a), cands[0]); if (Math.abs(x - n) < bd && next.filter((m) => pc(m) === pc(n)).length > 1) { bd = Math.abs(x - n); bi = i; } });
      const cands = cand.filter((x) => pc(x) === q); next[bi] = cands.reduce((a, y) => (Math.abs(y - next[bi]) < Math.abs(a - next[bi]) ? y : a), cands[0]);
    }
    next.sort((a, b2) => a - b2);
    prev = next;
    S.strings.push({ t: T(b), dur: o.dur || BAR, notes: next.slice(), vel, att: o.att || 0.25, rel: o.rel || 0.5, bright: o.bright || 1, bar: b });
  };
  for (let b = 8; b < 16; b++) strings(b, b < 12 ? 0.55 : 0.62, { att: 0.4, bright: b < 12 ? 1 : 0.7 });
  for (let b = 16; b < 24; b++) strings(b, b === 18 || b === 19 ? 0.7 : 0.85, { att: b === 16 || b === 20 ? 0.02 : 0.2, bright: 1.1 });
  for (let b = 32; b < 40; b++) strings(b, 0.95, { att: b === 32 ? 0.02 : 0.15, bright: 1.25 });
  for (let b = 40; b < 44; b++) strings(b, 0.6, { att: 0.6, rel: 0.8, bright: 0.85 });

  /* ── drums & clockwork ── */
  const HATV = [1, 0.38, 0.62, 0.38, 0.62, 0.38, 0.9, 0.38, 0.62, 0.38, 0.62, 0.45];
  const ticks = (b0, b1, vel) => { for (let b = b0; b < b1; b++) for (let s = 0; s < 12; s += 2) S.tick.push({ t: T(b, s) + hum(0.002), vel: vel * (s === 0 ? 1 : 0.8), tock: (s / 2) & 1 }); };
  ticks(2, 4, 0.35); ticks(4, 8, 0.5); ticks(8, 16, 0.55); ticks(16, 18, 0.5); ticks(20, 24, 0.5); ticks(32, 40, 0.45); ticks(44, 47, 0.4);
  // §1: a soft pulse under the metamorphosis
  for (let b = 4; b < 8; b++) S.kickM.push({ t: T(b), vel: 0.45 + (b - 4) * 0.1 });
  // §2: the sway
  for (let b = 8; b < 16; b++) {
    if (b === 15) break;
    S.kick.push({ t: T(b), vel: 0.9 });
    if (b % 2 === 1) S.kick.push({ t: T(b, 10), vel: 0.45 });
    S.clap.push({ t: T(b, 6), vel: 0.75 });
    for (let s = 0; s < 12; s++) S.hatC.push({ t: T(b, s) + hum(0.004), vel: HATV[s] * 0.55 });
  }
  S.kick.push({ t: T(15), vel: 0.9 });
  // bar 15: roll in sixteenths then 32nds
  for (let s = 0; s < 12; s++) S.snare.push({ t: T(15, s), vel: 0.3 + s * 0.035, rate: 1 + s * 0.006 });
  for (let i = 0; i < 12; i++) S.snare.push({ t: T(15, 6) + i * STEP * 0.5, vel: 0.55 + i * 0.03, rate: 1.08 + i * 0.012 });
  // §3: the drive
  const driveDrums = (b0, b1, skip, big) => {
    for (let b = b0; b < b1; b++) {
      if (skip && skip(b)) continue;
      S.kick.push({ t: T(b), vel: 1 }, { t: T(b, 6), vel: 0.95 });
      if (b % 2 === 1) S.kick.push({ t: T(b, 10), vel: 0.6 });
      if (big && b % 4 === 3) S.kick.push({ t: T(b, 4), vel: 0.55 });
      S.clap.push({ t: T(b, 6), vel: 1 });
      S.snare.push({ t: T(b, 3), vel: 0.16, rate: 1 }, { t: T(b, 9), vel: 0.2, rate: 1 });
      for (let s = 0; s < 12; s++) {
        if (s === 6 || s === 0) S.hatO.push({ t: T(b, s + 2) + hum(0.003), vel: 0.45 });
        else S.hatC.push({ t: T(b, s) + hum(0.004), vel: HATV[s] * 0.7 });
      }
    }
  };
  driveDrums(16, 24, (b) => b === 18 || b === 19);
  // the tribar reveal: a held breath, then a fill
  for (let s = 0; s < 12; s += 3) S.snare.push({ t: T(19, s), vel: 0.22 + s * 0.03, rate: 1 });
  for (let s = 6; s < 12; s++) S.tom.push({ t: T(19, s), note: 52 - s, vel: 0.5 + s * 0.04 });
  // the stairs: footsteps and an endless ascending arpeggio
  let shepIx = 0;
  for (let b = 20; b < 24; b++) for (const s of [0, 6]) {
    S.step.push({ t: T(b, s), vel: 0.9, alt: s ? 1 : 0 });
    const pcs = CH(b).tones.map(pc);
    const arp = []; for (let q = 48; arp.length < 40; q++) if (pcs.includes(pc(q))) arp.push(q);
    S.shep.push({ t: T(b, s) + 0.01, note: arp[shepIx++ % arp.length], vel: 0.5 });
  }
  // §4: ant steps
  for (let b = 24; b < 32; b++) for (let s = 0; s < 12; s++) {
    if (R() < 0.18) continue;
    S.ant.push({ t: T(b, s) + hum(0.01), vel: 0.25 + R() * 0.3, pan: (R() - 0.5) * 1.4 });
  }
  for (let b = 28; b < 32; b++) { S.kickM.push({ t: T(b), vel: 0.5 + (b - 28) * 0.12 }, { t: T(b, 6), vel: 0.4 + (b - 28) * 0.1 }); }
  for (let b = 30; b < 32; b++) for (let s = 0; s < 12; s++) S.hatC.push({ t: T(b, s) + hum(0.004), vel: HATV[s] * (0.3 + (b - 30) * 0.2) });
  for (let s = 0; s < 12; s++) S.snare.push({ t: T(31, s), vel: 0.35 + s * 0.035, rate: 1 + s * 0.008 });
  for (let i = 0; i < 12; i++) S.snare.push({ t: T(31, 6) + i * STEP * 0.5, vel: 0.6 + i * 0.028, rate: 1.1 + i * 0.012 });
  // §5: the climax
  driveDrums(32, 40, null, true);
  for (const b of [32, 34, 36, 38]) S.timp.push({ t: T(b), note: CH(b).tonic - 24, vel: 1 }, { t: T(b, 6), note: CH(b).tonic - 29, vel: 0.7 });
  for (const b of [35, 39]) for (let s = 6; s < 12; s++) S.tom.push({ t: T(b, s), note: 55 - (s - 6) * 2, vel: 0.55 + (s - 6) * 0.07 });
  // §6: the Risset rhythm — a beat that speeds up forever and never gets faster
  {
    const t0 = T(40), P = T(44) - t0, r0 = 1 / BEAT;
    const L = [];
    for (let j = 0; j < 5; j++) {
      const rj = r0 * Math.pow(2, j - 1);
      for (let n = 0; ; n++) {
        const t = P * Math.log2(1 + (n * Math.LN2) / (rj * P));
        if (t >= P - 0.02) break;
        const x = j - 1 + t / P;           // log2 of tempo relative to the beat
        const w = Math.exp(-0.5 * Math.pow((x - 1.1) / 0.85, 2));
        L.push({ t: t0 + t, layer: j, w });
      }
    }
    L.sort((a, b) => a.t - b.t);
    for (const e of L) {
      if (e.w < 0.03) continue;
      if (e.layer <= 2) S.kick.push({ t: e.t, vel: 0.95 * e.w, risset: 1 });
      if (e.layer >= 2) S.hatC.push({ t: e.t, vel: 0.75 * e.w, risset: 1 });
      S.risset.push([e.t, e.layer, e.w]);
    }
  }
  S.kick.push({ t: T(44), vel: 1 });
  S.kickM.push({ t: T(45), vel: 0.4 }, { t: T(46), vel: 0.3 });

  /* ── cymbals, impacts, sweeps ── */
  for (const b of [8, 16, 20, 32, 36]) S.crash.push({ t: T(b), vel: b === 8 ? 0.7 : 1 });
  for (const b of [12, 16, 20, 32, 44]) S.impact.push({ t: T(b), vel: b === 44 ? 0.9 : b === 12 ? 0.85 : 1 });
  S.impact.push({ t: T(8), vel: 0.5 });
  for (const b of [12, 16, 20, 32]) S.revCym.push({ t: T(b) - 2 * BEAT, vel: 1 });
  S.whoosh.push({ t: T(11, 6), dur: BEAT, vel: 0.7 });
  S.whoosh.push({ t: T(18), dur: 2 * BAR, vel: 0.6, slow: 1 });
  S.whoosh.push({ t: T(33, 6), dur: BEAT, vel: 0.55 }, { t: T(35, 6), dur: BEAT, vel: 0.55 }, { t: T(37, 6), dur: BEAT, vel: 0.55 });
  S.whoosh.push({ t: T(47), dur: BAR, vel: 0.6 });
  S.down.push({ t: T(24), dur: 3.2, vel: 0.8 }, { t: T(44), dur: 4, vel: 0.75 });
  // Shepard–Risset glissandi: risers that never arrive
  S.gliss.push({ t: T(6, 6), dur: T(8) - T(6, 6), vel: 0.7, rate: 5, shape: 'rise' });
  S.gliss.push({ t: T(14), dur: T(16) - T(14), vel: 0.85, rate: 6, shape: 'rise' });
  S.gliss.push({ t: T(28), dur: T(32) - T(28), vel: 0.9, rate: 4, shape: 'rise' });
  S.gliss.push({ t: T(40), dur: T(44) - T(40), vel: 0.62, rate: 3.2, shape: 'hold' });

  /* ── bells ── */
  S.bell.push({ t: 0.35, note: 81, vel: 0.35, decay: 3.2, pan: -0.2 });
  S.bell.push({ t: T(1, 6), note: 86, vel: 0.28, decay: 3, pan: 0.25 });
  for (const b of [8, 16, 32]) { const c = CH(b); S.bell.push({ t: T(b), note: c.tonic + 24, vel: 0.4, decay: 3, pan: 0 }); }
  S.bell.push({ t: T(12), note: CH(12).tonic + 19, vel: 0.45, decay: 3.4, pan: 0 });
  S.bell.push({ t: T(20), note: CH(20).tonic + 24, vel: 0.5, decay: 3, pan: 0 }, { t: T(20, 3), note: CH(20).tonic + 31, vel: 0.35, decay: 2.5, pan: 0.3 });
  S.bell.push({ t: T(48), note: 86, vel: 0.42, decay: 3.4, pan: 0 }, { t: T(48) + 0.02, note: 81, vel: 0.3, decay: 3.4, pan: -0.25 });

  /* ── marks for the picture ── */
  S.marks = { inversion: [T(12), T(34), T(36), T(38)], cubes: [], close: T(20) };
  return S;
}

/* ═════════════════════════════ THE ENGINE ═════════════════════════════ */

function* renderGen(opts) {
  opts = opts || {};
  const SR = Math.min(48000, opts.sampleRate || 44100);
  const N = Math.round(DURATION * SR);
  const S = buildScore();
  const RND = rng(1972);

  /* ---------- building blocks ---------- */
  const SIN_N = 4096;
  const SIN = new Float32Array(SIN_N + 1);
  for (let i = 0; i <= SIN_N; i++) SIN[i] = Math.sin((i / SIN_N) * TAU);

          const base = V3.add(pos, V3.add(V3.mul(fr.x, sc * (row * 0.12 + swing * 0.5)), V3.mul(fr.z, sc * 0.1)));
          const tip = V3.add(base, V3.add(V3.mul(fr.y, side * sc * 0.36), V3.add(V3.mul(fr.x, sc * (row * 0.14 + swing)), V3.mul(fr.z, -sc * 0.1))));
          const mid = V3.mul(V3.add(base, tip), 0.5), dir = V3.sub(tip, base), L = V3.len(dir);
          const lx = V3.norm(dir), lz = V3.norm(V3.cross(lx, fr.x)), ly = V3.cross(lz, lx);
          batch3.box(mid, [L / 2, 0.02, 0.02], [lx, ly, lz], [0, 0, 0, 0], [1, 1, 0, 0]);
        }
      }
    }
  }
  const U = uniforms3D(cam, { night, carve, carveDir });
  GFX.draw('cube', batch.a, batch.n, U);
  if (batch2.n) GFX.draw(t >= T(24) ? 'ant' : 'monk', batch2.a, batch2.n, Object.assign({}, U, { uCarveN: 0 }));
  if (batch3.n) GFX.draw('cube', batch3.a, batch3.n, Object.assign({}, U, { uCarveN: 0 }));
  GFX.end3D();
  F.use[1] = 1;
  if (night) F.invert = 1;
}
const EIGHTH_S = SYNTH.EIGHTH;

/* ───────── §5: circle limit ─────────
   The {6,4} tiling of the Poincaré disk: hexagons, four at every corner,
   black and white by turns. Each pixel is folded into one triangle of the
   (6,4,2) reflection group, counting mirrors on the way; hexagon edges are
   bent into S-curves (point-symmetric about their midpoints, so a black
   hexagon loses exactly what its white neighbour gains) — Escher's recipe,
   in the geometry Coxeter showed him in 1957. */
const HYP_FS = `
uniform vec4 uMob;        // Möbius motion: a (the point sent to the centre), rotation (cos, sin)
uniform vec4 uShape;      // S-curve amplitudes (a1, a2, a3), detail visibility
uniform vec4 uDisk;       // centre (px), radius (px), edge line width (px)
uniform vec4 uLook;       // invert, tile→gray fade, pulse, unused
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
vec2 cdiv(vec2 a, vec2 b){ float d = dot(b,b); return vec2(a.x*b.x + a.y*b.y, a.y*b.x - a.x*b.y) / d; }
vec2 cconj(vec2 a){ return vec2(a.x, -a.y); }
// f(u) on the half edge from its midpoint (u=0) to its corner (u=1)
float edgeF(float u){ return uShape.x*sin(PI*u) + uShape.y*sin(2.0*PI*u) + uShape.z*sin(3.0*PI*u); }
float tileInk(vec2 z, out float gray) {
  const float P = 6.0, Q = 4.0;
  float a = PI / P;
  vec2 n2 = vec2(-sin(a), cos(a));
  // the third mirror: circle orthogonal to the boundary, crossing the x-axis at R
  float cR = cos(PI/Q) / sin(PI/P);
  float dR = log(cR + sqrt(cR*cR - 1.0));       // acosh
  float rR = tanh(dR * 0.5);
  float cc = 0.5 * (rR + 1.0/rR), rho = 0.5 * (1.0/rR - rR);
  int nAll = 0, nC = 0;
  for (int i = 0; i < 64; i++) {
    bool done = true;
    if (z.y < 0.0) { z.y = -z.y; nAll++; done = false; }
    float d2 = dot(z, n2);
    if (d2 > 0.0) { z -= 2.0 * d2 * n2; nAll++; done = false; }
    vec2 w = z - vec2(cc, 0.0); float r2 = dot(w, w);
    if (r2 < rho*rho) { z = vec2(cc, 0.0) + w * (rho*rho / r2); nAll++; nC++; done = false; }
    if (done) break;
  }
  // local frame at the edge midpoint R: send R to 0, the edge becomes the imaginary axis
  vec2 w = cdiv(z - vec2(rR, 0.0), vec2(1.0, 0.0) - rR * z);
  // the corner Q, in the same frame
  vec2 q = vec2(cos(a), sin(a)); // direction of PQ; find Q on that ray inside the circle
  float t0; { // |t q - C|^2 = rho^2, smaller root
    float b = dot(q, vec2(cc,0.0)), c = cc*cc - rho*rho; t0 = b - sqrt(max(b*b - c, 0.0)); }
  vec2 zQ = t0 * q;
  vec2 wQ = cdiv(zQ - vec2(rR, 0.0), vec2(1.0, 0.0) - rR * zQ);
  float L = wQ.y;
  float u = clamp(w.y / L, 0.0, 1.0);
  float d = -w.x / L;                                   // toward the hexagon centre is positive
  bool odd = (nAll & 1) == 1;
  float f = edgeF(u);
  float s = odd ? d + f : d - f;                        // > 0 inside this hexagon
  float h = float(nC & 1);
  // an eye in every lobe: lobes only bite into even triangles, so the eye sits there, clear of the mirrors
  float eye = 0.0;
  if (uShape.w > 0.0 && !odd) {
    float fe = edgeF(0.5);
    vec2 pe = vec2((u - 0.5) * 1.1, d - fe * 0.52);
    eye = 1.0 - smoothstep(0.052 * uShape.w - fwidth(d), 0.052 * uShape.w + fwidth(d), length(pe));
  }
  float aa = fwidth(d) * 1.1;
  float inside = smoothstep(-aa, aa, s);
  float ink = mix(1.0 - h, h, inside);
  ink = mix(ink, 1.0 - ink, eye);
  gray = 0.0;
  return ink;
}
void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 z = (px - uDisk.xy) / uDisk.z;
  float r = length(z);
  float ink = 0.0, cover = 0.0;
  if (r < 1.0) {
    // Möbius motion: z -> e^{iθ} (z - a) / (1 - conj(a) z)
    vec2 A = uMob.xy;
    vec2 m = cmul(uMob.zw, cdiv(z - A, vec2(1.0, 0.0) - cmul(cconj(A), z)));
    float g;
    ink = tileInk(m, g);
    // where hexagons shrink below a couple of pixels, let them settle to grey
    float pxH = 2.0 / (uDisk.z * (1.0 - r*r));            // one pixel in hyperbolic units (approx)
    float fade = smoothstep(0.035, 0.11, pxH);
    ink = mix(ink, 0.5, fade * uLook.y);
    cover = 1.0;
  }
  // the rim
  float edge = abs(r - 1.0) * uDisk.z;
  float rim = 1.0 - smoothstep(uDisk.w - 0.7, uDisk.w + 0.7, edge);
  ink = max(ink * cover, rim);
  cover = max(cover, rim);
  ink = mix(ink, 1.0 - ink, uLook.x) * cover;
  o = vec4(ink, cover, 0.0, 1.0);
}
`;
function hypMotion(t) {
  // a slow drift along one geodesic, a turn on every bar, a lunge on the big beats
  const x = t - T(32);
  const drift = 0.32 * x + 0.9 * ss(T(38), T(40), t) * (t - T(38));
  const a = Math.tanh(drift * 0.5) ;
  const dir = 0.6 + 0.25 * Math.sin(x * 0.4);
  let A = [a * Math.cos(dir), a * Math.sin(dir)];
  // hyperbolic translation composes; approximate by moving the pre-image point
  const bars = x / BAR;
  const turn = (Math.floor(bars) + easeIO(sat((bars % 1) / 0.25))) * (Math.PI / 6) * 0.5;
  return { A, rot: [Math.cos(turn), Math.sin(turn)] };
}
function drawCircleLimit(t, F) {
  const W = GFX.W, H = GFX.H;
  const R = DISK_FRAC * Math.min(W, H);
  const grow = easeOut(sat((t - T(32)) / 0.9));
  const mv = hypMotion(t);
  // S-curve: lobes swell in on the drop
  const amp = lerp(0.0, 1, grow);
  const flip = [T(34), T(36), T(38)].reduce((acc, b) => acc + (t >= b ? 1 : 0), 0) & 1;
  GFX.runScene('hyp', {
    uMob: [mv.A[0], mv.A[1], mv.rot[0], mv.rot[1]],
    uShape: [0.34 * amp, 0.1 * amp, -0.05 * amp, ss(0.6, 0.95, amp)],
    uDisk: [W / 2, H / 2, R * lerp(0.985, 1, grow), Math.max(1.2, 1.6 * GFX.scale)],
    uLook: [flip, 1, 0, 0],
  });
  F.use[0] = 1;
}

/* ───────── §6: the print gallery ─────────
   The bird division, carried through the complex logarithm: w = log z turns
   circles into lines, so a periodic pattern becomes a spiral that shrinks
   into the centre for ever. The twist is chosen so that once round the
   centre is exactly one period of the pattern (2 cells across, 8 along —
   and the colouring agrees), so there is no seam. Zooming is a slide along
   w; the centre stays blank, as it does in Escher's Print Gallery, and what
   is written in the blank is where the piece began. */
const DROSTE_FS = `
uniform vec4 uSp;     // centre (px), unit (px), unused
uniform vec4 uMap;    // k, beta, zoom (natural log), unused
uniform vec4 uClip;   // outer radius (px), feather, invert, grey-out
void main(){
  vec2 p = gl_FragCoord.xy - uSp.xy;
  float r = max(length(p), 1e-3);
  vec2 w = vec2(log(r / uSp.z) - uMap.z, atan(p.y, p.x));
  float c = cos(uMap.y), s = sin(uMap.y);
  mat2 M = uMap.x * mat2(c, s, -s, c);               // columns: rotation × k
  vec2 tc = M * w; tc.x = -tc.x;
  // derivatives of w taken analytically, so the branch cut of atan leaves no seam
  vec2 dwdx = vec2(p.x, -p.y) / (r * r), dwdy = vec2(p.y, p.x) / (r * r);
  vec2 gx = M * dwdx; gx.x = -gx.x;
  vec2 gy = M * dwdy; gy.x = -gy.x;
  float ink = textureGrad(uTex0, tc * 0.5, gx * 0.5, gy * 0.5).r;
  float cover = 1.0 - smoothstep(uClip.x - uClip.y, uClip.x + uClip.y, r);
  ink = mix(ink, 1.0 - ink, uClip.z);
  o = vec4(ink * cover, cover, 0.0, 1.0);
}
`;
const tileCv = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; return c; })();
let tileKey = '';
function tileTexture(m, u) {
  const key = m.toFixed(3) + ':' + u.toFixed(3);
  if (key === tileKey) return;
  tileKey = key;
  const g = tileCv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 1024);
  TILES.drawChecker(g, [512, 0, 0, 512, 0, 0], 1024, 1024, { at: () => ({ m, A: TILES.DESIGNS.bird, B: TILES.DESIGNS.fish, u }), ink: '#fff', paper: '#000', lineW: 0.026 });
  GFX.uploadCanvas('tile', tileCv, { wrap: true });
}
// twist: once round = (2, 8) cells
const DK = Math.hypot(2, 8) / (2 * Math.PI), DB = Math.atan2(-2, 8);
const ZOOM_RATE = 0.62;   // e-folds per second
function drawGallery(t, F) {
  const W = GFX.W, H = GFX.H;
  const unit = Math.min(W, H) * 0.5;
  const full = Math.hypot(W, H) * 0.5;
  const m = 1 - ss(T(44), T(46, 6), t);
  tileTexture(m, 0);
  const zoom = ZOOM_RATE * (t - PIECE);            // 0 when the title fills the screen
  const outer = lerp(DISK_FRAC * Math.min(W, H), full * 1.05, easeOut(sat((t - T(40)) / 0.7)));
  GFX.runScene('droste', {
    uSp: [W / 2, H / 2, unit, 0],
    uMap: [DK, DB, zoom, 0],
    uClip: [outer, 1.2, 0, 0],
  }, { uTex0: 'tile' });
  F.use[0] = 1;
  // the blank at the centre, and the title written in it
  const sigma = Math.exp(Math.min(0, zoom));
  const rHole = sigma * full * 1.02;
  const ctx = GFX.begin2D();
  if (rHole > 0.3) {
    ctx.save();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, rHole, 0, Math.PI * 2);
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.clip();
    const L = titleLayout();
    const v = view2D(L.cx, L.cy, L.s * sigma, 0);
    // centre the title card on the screen centre while it is small, as it is at full size
    drawLetterGrid(ctx, v, 10, {});
    drawSubtitle(ctx, v, 1);
    ctx.restore();
    if (rHole < full) {
      ctx.beginPath(); ctx.arc(W / 2, H / 2, rHole, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1, 1.4 * GFX.scale); ctx.strokeStyle = INK; ctx.stroke();
    }
  }
  GFX.upload2D();
  F.use[2] = 1;
}

/* ───────── frame / idle ───────── */
function init() {
  GFX.addScene('hyp', HYP_FS);
  GFX.addScene('droste', DROSTE_FS);
  GFX.mesh('cube', GEO.cube());
  GFX.mesh('monk', monkMesh());
  GFX.mesh('ant', antMesh());
}
function frame(t, o) {
  calm = !!(o && o.calm);
  const F = { use: [0, 0, 0], T: t, invert: 0 };
  if (t < T(15)) drawPlane(t, F);
  else if (t < T(32)) drawSolid(t, F);
  else if (t < T(40)) drawCircleLimit(t, F);
  else drawGallery(Math.min(t, PIECE), F);
  // the last seconds: the music rings out over the title
  GFX.composite(F);
}
function idle(tw, st) {
  calm = !!st.calm;
  const L = titleLayout();
  const ctx = GFX.begin2D();
  const v = view2D(L.cx, L.cy, L.s, 0);
  drawLetterGrid(ctx, v, 10, {});
  const at = drawSubtitle(ctx, v, 1);
  drawButton(ctx, at, st, tw);
  GFX.upload2D();
  GFX.composite({ use: [0, 0, 1], T: 0 });
}
function button() { return BUTTON; }

return { init, frame, idle, setMusic, button };
})();

<script>
/* ─────────────────────────────────────────────────────────────────────────
   main.js — boot, sound, clock, input, loop.
   ───────────────────────────────────────────────────────────────────────── */
(function () {
'use strict';
const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
const DURATION = SYNTH.DURATION;
const START_AT = Math.max(0, Math.min(DURATION - 1, parseFloat(params.get('t') || '0') || 0));
const canvas = document.getElementById('screen');
// viewers who ask for less motion get the piece without flashes and shakes
const calm = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

let music = null, progress = 0, ready = false, pendingStart = false;
let actx = null, buffer = null, source = null;
let playing = false, paused = false, pausedAt = 0, startCtx = 0, offset = 0;
let hover = false, idleSince = 0, lastMove = 0, ended = false;
const boot = performance.now();
const wall = () => (performance.now() - boot) / 1000;

/* ───────── fonts ───────── */
async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  await Promise.race([
    Promise.allSettled([document.fonts.load('italic 500 40px "Cormorant Garamond"'), document.fonts.load('500 40px "Cormorant Garamond"')]),
    new Promise((r) => setTimeout(r, 2500)),
  ]);
}

/* ───────── the soundtrack ───────── */
function onMusic(out) {
  music = out;
  SCENES.setMusic(out);
  progress = 1;
  ready = true;
  if (CAPTURE) window.__ready = true;
  if (pendingStart) start(START_AT);
}
function synthOnMain(src, sampleRate) {
  window.__synthPath = 'main';
  const SY = new Function(src + '\nreturn SYNTH;')();
  const g = SY.renderGen({ sampleRate });
  const step = () => {
    const t0 = performance.now();
    for (;;) {
      const r = g.next();
      if (r.done) { onMusic(r.value); return; }
      progress = r.value;
      if (performance.now() - t0 > 24) break;
    }
    setTimeout(step, 0);
  };
  step();
}
function startSynth(sampleRate) {
  const src = document.getElementById('synth-src').textContent;
  const bootSrc = `
self.onmessage = function (e) {
  try {
    var g = SYNTH.renderGen(e.data), r, last = 0;
    while (!(r = g.next()).done) { var now = Date.now(); if (now - last > 50) { self.postMessage({ progress: r.value }); last = now; } }
    var o = r.value;
    self.postMessage({ done: true, out: o }, [o.L.buffer, o.R.buffer, o.env.buffer, o.master.buffer]);
  } catch (err) { self.postMessage({ error: String((err && err.stack) || err) }); }
};`;
  let worker = null, settled = false;
  const fallback = () => { if (settled) return; settled = true; try { worker && worker.terminate(); } catch (e) { /* */ } synthOnMain(src, sampleRate); };
  try {
    const url = URL.createObjectURL(new Blob([src, bootSrc], { type: 'text/javascript' }));
    worker = new Worker(url);
    window.__synthPath = 'worker';
  } catch (e) { fallback(); return; }
  worker.onmessage = (e) => {
    const d = e.data;
    if (d.progress !== undefined) progress = d.progress;
    else if (d.done) { settled = true; worker.terminate(); onMusic(d.out); }
    else if (d.error) { console.warn(d.error); fallback(); }
  };
  worker.onerror = (e) => { e.preventDefault && e.preventDefault(); fallback(); };
  worker.postMessage({ sampleRate });
}

/* ───────── playback & clock ───────── */
function ensureAudio() {
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { actx = new AC({ latencyHint: 'playback' }); } catch (e) { actx = new AC(); }
  return actx;
}
function stopSource() {
  if (!source) return;
  try { source.onended = null; source.stop(); } catch (e) { /* already stopped */ }
  try { source.disconnect(); } catch (e) { /* */ }
  source = null;
}
function playFrom(t) {
  stopSource();
  offset = Math.max(0, Math.min(DURATION - 0.05, t));
  source = actx.createBufferSource();
  source.buffer = buffer;
  source.connect(actx.destination);
  startCtx = actx.currentTime + 0.1;
  source.start(startCtx, offset);
  playing = true; paused = false; ended = false;
}
function musicTime() {
  if (!playing) return 0;
  if (paused) return pausedAt;
  let ct;
  if (actx.getOutputTimestamp) {
    const ts = actx.getOutputTimestamp();
    if (ts && ts.contextTime > 0 && ts.performanceTime > 0) ct = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  }
  if (ct === undefined) ct = actx.currentTime - (actx.outputLatency || 0) - (actx.baseLatency || 0);
  return Math.max(0, ct - startCtx) + offset;
}
async function start(at) {
  if (!ready) { pendingStart = true; return; }
  pendingStart = false;
  const ctx = ensureAudio();
  if (!ctx) return;
  try { await ctx.resume(); } catch (e) { /* */ }
  if (!buffer || buffer.sampleRate !== music.sampleRate) {
    buffer = ctx.createBuffer(2, music.L.length, music.sampleRate);
    buffer.copyToChannel(music.L, 0);
    buffer.copyToChannel(music.R, 1);
  }
  playFrom(at || 0);
  document.body.classList.remove('play');
  goFullscreen();
}
function togglePause() {
  if (!playing || !actx) return;
  if (!paused) { pausedAt = musicTime(); paused = true; actx.suspend(); }
  else { actx.resume().then(() => { playFrom(pausedAt); }); }
}
function goFullscreen() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) { /* not allowed here */ }
}
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    const x = document.exitFullscreen || document.webkitExitFullscreen;
    if (x) try { const p = x.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) { /* */ }
  } else goFullscreen();
}

/* ───────── input ───────── */
function activate() {
  if (playing) return;
  if (!ready) { pendingStart = true; ensureAudio(); if (actx) actx.resume().catch(() => {}); return; }
  start(START_AT);
}
window.addEventListener('pointerup', (e) => { if (e.button === 0 || e.pointerType !== 'mouse') activate(); });
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (playing) togglePause(); else activate(); }
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  else if (playing && e.key === 'ArrowRight') playFrom(musicTime() + 5);
  else if (playing && e.key === 'ArrowLeft') playFrom(musicTime() - 5);
  else if (playing && (e.key === 'r' || e.key === 'R')) playFrom(0);
});
window.addEventListener('pointermove', (e) => {
  lastMove = wall();
  document.body.classList.remove('hide');
  if (!playing) {
    const r = canvas.getBoundingClientRect();
    const b = SCENES.button();
    hover = !!b && Math.hypot(e.clientX - r.left - b[0], e.clientY - r.top - b[1]) < b[2] * 1.6;
  }
});
window.addEventListener('resize', () => { if (GFX.gl) GFX.layout(); });

/* ───────── loop ───────── */
function frame() {
  requestAnimationFrame(frame);
  const tw = wall();
  if (playing) {
    const T = musicTime();
    if (T >= DURATION) {
      playing = false; stopSource(); idleSince = tw; ended = true;
    } else {
      SCENES.frame(T, { calm: calm() });
      document.body.classList.toggle('hide', tw - lastMove > 1.5);
      return;
    }
  }
  document.body.classList.toggle('play', ready);
  SCENES.idle(tw - idleSince, { progress, ready, hover, ended, calm: calm() });
}

/* ───────── boot ───────── */
(async function main() {
  await loadFonts();
  try {
    GFX.init({ canvas, capture: CAPTURE });
    SCENES.init();
  } catch (err) {
    console.error(err);
    document.body.classList.add('nogl');
    return;
  }
  let rate = 44100;
  if (!CAPTURE) { const ctx = ensureAudio(); if (ctx) rate = Math.min(48000, ctx.sampleRate || 44100); }
  startSynth(rate);
  if (CAPTURE) {
    window.__frame = (T) => SCENES.frame(T, { calm: false });
    window.__idle = (tw, p, r) => SCENES.idle(tw, { progress: p, ready: r, hover: false, ended: false, calm: false });
    window.__layout = () => GFX.layout();
    return;
  }
  window.__state = () => ({ ready, playing, paused, T: playing ? musicTime() : 0, synth: window.__synthPath, W: GFX.W, H: GFX.H });
  requestAnimationFrame(frame);
})();
})();
</script>
